include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.07.12
    file:
      - '/ci-templates/design-drift.yml'
      - '/ci-templates/parser-parity.yml'
      - '/ci-templates/removed-symbols.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.07.12"
  SAST_EXCLUDED_PATHS: "build/, vauchi-core/"
  SECRET_DETECTION_EXCLUDED_PATHS: "build/, vauchi-core/"
  SAST_ANALYZER_IMAGE_TAG: "5"
  # Core release whose C ABI carries the shared presentation contract fixture.
  VAUCHI_CORE_REF: v0.59.2

stages:
  - lint
  - deps
  - build
  - test
  - security
  - package
  - deploy

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger"

default:
  interruptible: true

build:cabi:
  stage: deps
  script:
    - git clone --depth 1 --branch ${VAUCHI_CORE_REF}
        https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/core.git
        vauchi-core
    - cd vauchi-core
    - cargo build --release -p vauchi-cabi --features secure-storage
    - mkdir -p ${CI_PROJECT_DIR}/cabi-lib
    - cp target/release/libvauchi_cabi.so target/release/libvauchi_cabi.a ${CI_PROJECT_DIR}/cabi-lib/
  artifacts:
    paths:
      - cabi-lib/
  tags: [linux]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:qt:
  stage: build
  needs: [build:cabi]
  script:
    - mkdir -p build && cd build
    - cmake .. -DVAUCHI_CABI_DIR=${CI_PROJECT_DIR}/cabi-lib
    - cmake --build . --parallel
  artifacts:
    paths:
      - build/
  tags: [linux]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:unit:
  stage: test
  needs: [build:qt, build:cabi]
  variables:
    QT_QPA_PLATFORM: offscreen
  script:
    - cd build
    - ctest --output-on-failure
  tags: [linux]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Coverage: build with gcov instrumentation, run tests, produce Cobertura XML.
# CMakeLists.txt already supports -DCOVERAGE=ON for gcov/lcov flags.
# Uses gcovr for Cobertura conversion and pushes metrics to Grafana Pushgateway.
coverage:unit:
  stage: test
  needs: [build:cabi]
  variables:
    QT_QPA_PLATFORM: offscreen
  script:
    - mkdir -p build-cov && cd build-cov
    - cmake .. -DVAUCHI_CABI_DIR=${CI_PROJECT_DIR}/cabi-lib -DCOVERAGE=ON
    - cmake --build . --parallel
    - ctest --output-on-failure || true
    - cd ${CI_PROJECT_DIR}
    - |
      # Produce Cobertura XML from gcov data (exclude tests/ and system headers)
      uvx --from gcovr==8.3 gcovr --root . --filter 'src/' \
        --xml cobertura.xml \
        --print-summary \
        build-cov/
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fci%2Fpush-coverage.sh/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o push-coverage.sh
      chmod +x push-coverage.sh
    - ./push-coverage.sh cobertura.xml linux-qt || true
  coverage: '/Line Coverage:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
    paths:
      - cobertura.xml
    expire_in: 1 week
  tags: [linux]
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "src/**"
          - "tests/**/*.cpp"
          - "CMakeLists.txt"
          - ".gitlab-ci.yml"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# AT-SPI accessibility + widget tree tests
# Uses a venv with --system-site-packages so we can install pytest/Pillow
# while inheriting gi (PyGObject), a system-only package for AT-SPI.
.atspi-base:
  stage: test
  needs: [build:qt, build:cabi]
  tags: [linux, self-hosted]
  # Self-heal AT-SPI startup-timing flakes ("qvauchi did not appear in
  # the AT-SPI tree within Ns") shared by every job extending this base.
  # A transient registration race heals on retry; a real regression
  # fails all attempts, so retry cannot mask a true break.
  retry:
    max: 2
    when:
      - script_failure
      - stuck_or_timeout_failure
      - runner_system_failure
  variables:
    QT_ACCESSIBILITY: "1"
    LD_LIBRARY_PATH: "${CI_PROJECT_DIR}/cabi-lib"
  before_script:
    - uv venv --system-site-packages .venv
    - source .venv/bin/activate
    - uv pip install --quiet -r tests/atspi/requirements.txt

test:a11y:
  extends: .atspi-base
  script:
    - tests/atspi/run-tests.sh -v --tb=short -k "not test_snapshots"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "src/**"
          - "tests/atspi/**"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Security Stage
# ============================================================

semgrep-sast:
  allow_failure: false
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.cpp"
          - "**/*.h"
          - "**/*.hpp"
          - "CMakeLists.txt"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

secret_detection:
  allow_failure: false
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Presentation drift: verify every canonical presentation node is rendered.
check:design-drift:
  extends: .design-drift-job
  variables:
    DESIGN_DRIFT_PROTOCOL: "presentation"
    DESIGN_DRIFT_MATCH_MODE: "grep"
    DESIGN_DRIFT_GREP_FILE: "src/coreui"
    CORE_REF: "v0.59.0-dev.2"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "src/coreui/presentationsurface*.cpp"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "src/coreui/presentationsurface*.cpp"
          - ".gitlab-ci.yml"

# Parser-parity gate for Core's canonical PresentationNode enum.
check:parser-parity:
  extends: .parser-parity-job
  variables:
    FRONTEND_NAME: "linux-qt"
    PARSER_FILE: "src/coreui"
    PARSER_PROTOCOL: "presentation"
    PARSER_SCRIPT_REF: "ci-templates-v2026.07.12"
    CORE_REF: "v0.59.0-dev.2"

# Removed symbols: detect stale references to removed features
check:removed-symbols:
  extends: .removed-symbols-job
  variables:
    SEARCH_DIRS: "src/ tests/ include/"

# Cross-cutting lint bundle (blocking): design-token drift + Humble-UI ratchet.
# Replaces check:design-tokens and lint:humble per P3b.
lint:cross-cutting-blocking:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim
  tags: [docker]
  needs: []
  allow_failure: false
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates bash findutils grep
    - mkdir -p .ratchet-scripts
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check.py/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check.py
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check_rules.json/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check_rules.json
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check.baseline.json/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check.baseline.json
  script:
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fcheck-design-tokens.sh/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o check-design-tokens.sh
      chmod +x check-design-tokens.sh
    - ./check-design-tokens.sh --strict src/
    - python3 .ratchet-scripts/humble_check.py --repo "${CI_PROJECT_NAME}" --repo-path "${CI_PROJECT_DIR}" --config .ratchet-scripts/humble_check_rules.json --check .ratchet-scripts/humble_check.baseline.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.cpp"
          - "**/*.cc"
          - "**/*.cxx"
          - "**/*.h"
          - "**/*.hpp"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Package Stage — build-verification for distro packages
# ============================================================
# Only run on tags or manual trigger — not on every MR.

package:deb:
  stage: package
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/debian:bookworm
  tags: [docker]
  needs:
    - job: build:qt
      optional: true
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq devscripts debhelper cmake g++ pkg-config
        qt6-base-dev libqrencode-dev cargo rustc git
        qt6-multimedia-dev libzbar-dev qt6-connectivity-dev libpcsclite-dev
  script:
    - dpkg-buildpackage -us -uc -b
    - mkdir -p deb-out && cp ../*.deb deb-out/
  artifacts:
    paths:
      - deb-out/*.deb
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

package:rpm:
  stage: package
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/fedora:40
  tags: [docker]
  needs:
    - job: build:qt
      optional: true
  before_script:
    - dnf install -y rpm-build cmake gcc-c++ pkg-config qt6-qtbase-devel
        qrencode-devel cargo rust git-core
        qt6-qtmultimedia-devel zbar-devel qt6-qtconnectivity-devel
        pcsc-lite-devel
  script:
    - mkdir -p rpmbuild/{SOURCES,SPECS}
    - tar czf rpmbuild/SOURCES/vauchi-qt-0.5.0.tar.gz
        --transform 's,^,vauchi-qt-0.5.0/,' --exclude=rpmbuild .
    - cp packaging/vauchi-qt.spec rpmbuild/SPECS/
    - rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/vauchi-qt.spec
    - mkdir -p rpm-out && cp rpmbuild/RPMS/**/*.rpm rpm-out/
  artifacts:
    paths:
      - rpm-out/*.rpm
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages

github-mirror:
  extends: .github-mirror
